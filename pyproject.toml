[project]
name = "support-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pramila003", email = "pramila.yamgar007@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bcrypt<4.1.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.159.1",
    "motor>=3.7.1",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
support-platform = "support_platform:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
